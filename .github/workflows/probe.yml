name: Probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install opencv-python-headless==4.10.0.84
      - run: python3 probe/probe3.py
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -f probe/result3.json; git add -f models/ || true; git commit -m "probe result"; git push
