name: Probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/probe.py
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add probe/result.json; git commit -m "probe result"; git push
